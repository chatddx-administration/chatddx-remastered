[translations.guided]
description = "lines-guided in Swedish: its instructions, worked example, output and appendix layout."

[[translations.guided.of."instructions.clinician"]]
text = "You are assisting a physician in an emergency department. Read the case and give your assessment."
translation = "Du bistår en läkare på en akutmottagning. Läs fallet och ge din bedömning."

[[translations.guided.of."few_shot.worked-example"]]
text = "A 67-year-old man has had crushing central chest pain for an hour, with sweating."
translation = "En 67-årig man har sedan en timme kraftig central bröstsmärta, med kallsvett."

[[translations.guided.of."few_shot.worked-example"]]
text = "Acute coronary syndrome\nAortic dissection\nPulmonary embolism"
translation = "Akut koronart syndrom\nAortadissektion\nLungemboli"

[[translations.guided.of."output.lines"]]
text = "List the plausible diagnoses, one per line, most likely first."
translation = "Lista de tänkbara diagnoserna, en per rad, den mest sannolika först."

[[translations.guided.of."recipe.lines-guided"]]
text = "\n\nAppendices:\n"
translation = "\n\nBilagor:\n"
