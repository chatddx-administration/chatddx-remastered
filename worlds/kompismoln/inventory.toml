# Kompismoln's World: pelle and malborg, and the sample World's vignettes. The endpoints and hosts of the engines in
# factors.toml are what `chatddx import-engine http://pelle.km:12008/ http://malborg.km:12008/ --factors
# worlds/kompismoln/factors.toml --endpoints worlds/kompismoln/endpoints.toml` writes from the hosts' o11n reports.
# `chatddx init-data USER --world worlds/kompismoln --data worlds/sample/_data` loads the sample with those engines and
# checks each endpoint against the engine it serves.
include = ["endpoints.toml"]

[source.sample]
path = "../sample/vignettes"
sensitive = true

# The sensitive sources each endpoint may receive case-derived content from; the runner refuses anything else. Both
# are cleared for the sample until the clearance pipeline grants it (agents/wip-clearance.md, "Vetted endpoints").

[cleared]
"qwen3-8b@pelle" = ["sample"]
"gpt-oss-20b@malborg" = ["sample"]
