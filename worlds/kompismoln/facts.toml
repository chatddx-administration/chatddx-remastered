# Accommodating for pelle, which serves Qwen3-8B-AWQ with --max-model-len=8192 and no
# --reasoning-parser (engines.toml): these take the place of the bundled facts about it.

[model."Qwen/Qwen3-8B-AWQ"]
family = "qwen3"
parameters_b = 8.2
quantization = "awq"
context_length = 8192
licence = "apache-2.0"

[model."Qwen/Qwen3-8B-AWQ".reasoning]
default = "on"
off = { chat_template_kwargs = { enable_thinking = false } }
on = { chat_template_kwargs = { enable_thinking = true } }
minimal = "on"
low = "on"
medium = "on"
high = "on"
xhigh = "on"
budget = { refused = "pelle serves it without --reasoning-parser, and vLLM refuses a thinking budget without one" }

[model."Qwen/Qwen3-8B-AWQ".sampling.recommended]
on = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 1.5 }
off = { temperature = 0.7, top_p = 0.8, top_k = 20, presence_penalty = 1.5 }

[model."Qwen/Qwen3-8B-AWQ".sampling.generation_config]
temperature = 0.6
top_p = 0.95
top_k = 20

[model."Qwen/Qwen3-8B-AWQ".output]
default = "native"
native = {}
tool = {}
text = {}
