# Where the sample's engines (factors.toml) are served, and where their host keeps what they pin, as `chatddx
# import-engine` writes a real World's from its hosts' reports (worlds/kompismoln/endpoints.toml). The inventory
# includes it. An endpoint names the engine it serves by digest, which is also the name a local engine is served under,
# so changing an engine means changing its endpoint here.

# The fake engines run on this machine, one per engine, as vLLM serves one model a process. The fake host says where
# it keeps what they pin: the fake vLLM takes a model by its repo name, and the fake engines' empty chat template is
# /dev/null. `chatddx fake-engines` starts them all, each as `chatddx.inventory.start_up` says, once init-data has
# stored them.

[endpoint."qwen3-8b-awq@fake"]
engine = "sha256:cc0dc8fbbc8dbb3a62d274c6ce62ee4bc9d909b05aef6263015cb46459fdc42f"
url = "http://127.0.0.1:12099/v1/"
host = "fake"
max_jobs = 4

[endpoint."gpt-oss-20b@fake"]
engine = "sha256:fc08c407478623b2afdb709752f30ecc3333de3142a0d534bdbbb378a6d8e841"
url = "http://127.0.0.1:12100/v1/"
host = "fake"
max_jobs = 4

# A remote engine's endpoint has no host: someone else runs it. Its key is read from the environment variable
# `credential` names and sent as a bearer token; neither the key nor the variable's value is stored. `chatddx
# fake-engines` stands in for it on this machine, asking for the key the variable holds.
[endpoint."mistral-small@remote"]
engine = "sha256:afbf6e1b915fcea003c35b0d073872f98670bdd214cc2110db7e6ebab548b277"
url = "http://127.0.0.1:12101/v1/"
max_jobs = 2
credential = "CHATDDX_SAMPLE_KEY"

[host.fake]
bind = "127.0.0.1"

[host.fake.models]
"sha256:7781395e2ff446324a43c9d3dd81da3aa0e57ddc87a0da56e02776d3efac5e0d" = "Qwen/Qwen3-8B-AWQ"
"sha256:355721fac51cefbde383916197f19628d37ab99694dc58eb8e21888bdafb14b5" = "openai/gpt-oss-20b"

[host.fake.templates]
"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" = "/dev/null"
