[[translations.sample.of."output.diagnoses"]]
text = "List the plausible diagnoses, most likely first."
translation = "Lista de tänkbara diagnoserna, den mest sannolika först."

[[translations.sample.of."output.diagnoses"]]
text = "diagnoses"
translation = "diagnoser"

[[translations.sample.of."output.diagnoses"]]
text = "The commonly used name of the diagnosis."
translation = "Diagnosens vedertagna namn."

[[translations.sample.of."output.diagnoses-tool"]]
text = "Give your answer by calling this tool, with the answer as its arguments."
translation = "Ge ditt svar genom att anropa det här verktyget, med svaret som argument."

[[translations.sample.of."output.free-text"]]
text = "List the plausible diagnoses, one per line, most likely first."
translation = "Lista de tänkbara diagnoserna, en per rad, den mest sannolika först."

[[translations.sample.of."output.verdict"]]
text = "Say whether the answer meets the note: whether it reaches the same reading of the case and would lead to the same essential actions. Wording, order and extra detail don't matter; missing what the note calls for, or advice that would harm the patient, does. Give your reason in one or two sentences."
translation = "Säg om svaret motsvarar anteckningen: om det kommer fram till samma bedömning av fallet och skulle leda till samma väsentliga åtgärder. Ordval, ordning och extra detaljer spelar ingen roll; att missa det anteckningen kräver, eller råd som skulle skada patienten, gör det. Motivera med en eller två meningar."

[[translations.sample.of."output.verdict"]]
text = "Verdict"
translation = "Utlåtande"

[[translations.sample.of."output.verdict"]]
text = "Whether an answer meets a clinician's note on the case, and why."
translation = "Om ett svar motsvarar en klinikers anteckning om fallet, och varför."

[[translations.sample.of."output.verdict"]]
text = "Whether the answer meets the note."
translation = "Om svaret motsvarar anteckningen."

[[translations.sample.of."output.verdict"]]
text = "Why, in one or two sentences."
translation = "Varför, med en eller två meningar."

[[translations.sample.of."output.grade"]]
text = "Grade how well the answer meets the note, from 0 to 2: 2 when it reaches the same reading of the case and the same essential actions, 1 when it gets part of the way, 0 when it misses it or would mislead. Give your reason in one or two sentences."
translation = "Betygsätt hur väl svaret motsvarar anteckningen, från 0 till 2: 2 när det kommer fram till samma bedömning av fallet och samma väsentliga åtgärder, 1 när det når en del av vägen, 0 när det missar eller skulle vilseleda. Motivera med en eller två meningar."

[[translations.sample.of."output.grade"]]
text = "Grade"
translation = "Betyg"

[[translations.sample.of."output.grade"]]
text = "How well an answer meets a clinician's note on the case, and why."
translation = "Hur väl ett svar motsvarar en klinikers anteckning om fallet, och varför."

[[translations.sample.of."output.grade"]]
text = "How well the answer meets the note, from 0 (not at all) to 2 (fully)."
translation = "Hur väl svaret motsvarar anteckningen, från 0 (inte alls) till 2 (helt)."

[[translations.sample.of."toolset.web"]]
text = "You have access to a web_search tool. Use it whenever you need current facts, documentation, or anything you're not confident about from memory, instead of guessing."
translation = "Du har tillgång till verktyget web_search. Använd det när du behöver aktuella fakta, dokumentation eller något du inte är säker på utifrån minnet, i stället för att gissa."

[[translations.sample.of."toolset.web"]]
text = "Search the web for up-to-date information"
translation = "Sök på webben efter aktuell information"
