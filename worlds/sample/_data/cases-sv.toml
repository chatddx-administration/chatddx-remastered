[case.akm-01]
tags = ["akm", "copd"]
targets.diagnosis.pattern = "copd | (exacerbation | obstructive) & pulmonary"
targets.warning.pattern = "respiratory & failure | hypercapni* | airway | intubat* | andningssvikt | intuber*"
targets.disposition.pattern = "icu | intensive & care | iva | intensivvård*"

[case.akm-01.appendices]
blood-gas = "Blodgas efter 20 minuters maskventilation: pH 7,18, pCO2 11,2 kPa, pO2 9,8 kPa, BE +6, laktat 1,4 mmol/l."

[[case.akm-01.with]]
appendices = ["blood-gas"]
targets.diagnosis.pattern = "copd | (exacerbation | obstructive) & pulmonary"
targets.warning.pattern = "respiratory & failure | hypercapni* | airway | intubat* | andningssvikt | intuber*"
targets.disposition.pattern = "icu | intensive & care | iva | intensivvård*"

[[case.akm-01.targets.notes]]
author = "Olof"
comment = '''
Medvetande sänkt patient med hypoventilation och låg syrenivå efter behandling med högt syrgasflöde då patienten mådde bra, har KOL. Misstänkt koldioxidnarkos med upphävd andning.
Åtg: ta bort syrgas, försök smärtstimulera pat till att andas själv, om ingen effekt mask-blåsa-ventilation, försök även starta NIV.
Om ingen luft går i - näskantarell / svalgtub.
Om helt stel i käkarna, ineffektiv andning, försök relaxera patienten - benzodiazepiner -> mask-blåsa-ventilation och ventilera ut höga koldioxiden. Tillkalla narkosen - Överväg intubation.'''
answer = '''
Misstänkt koldioxidnarkos.
Vädra ur patienten, snabba luftvägsmanövrar: haklyft, näskantarell, svalgtub, mask &blåsa, överväg muskelrelaxation om du inte kan ventilera. narkoslarma. sista utväg: akut coniotomi.
varning för de-skill konsultation.'''

