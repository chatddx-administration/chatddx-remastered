[prompt.case]
segments = [{ slot = "vignette" }, { slot = "appendices" }]

[output.raw]
description = "Free text with no guidance: whatever the model makes of the case alone."
contract = { kind = "text" }

[sampling.generation-config]

[sampling.recommended]
description = "What the model's makers recommend for the reasoning asked for."
recommended = true

[sampling.greedy]
temperature = 0

[sampling.fixed]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0
frequency_penalty = 0

[reasoning.off]
level = "off"

[reasoning.on]
level = "on"

[reasoning.minimal]
level = "minimal"

[reasoning.low]
level = "low"

[reasoning.medium]
level = "medium"

[reasoning.high]
level = "high"

[reasoning.xhigh]
level = "xhigh"

[reasoning.on-budget-2048]
description = "A budget worth comparing against plain on."
level = "on"
thinking_token_budget = 2048

[passthrough.min-tokens]
description = "No answer shorter than 8 tokens: vLLM's min_tokens."
body = { min_tokens = 8 }

[tool.web_search]
name = "web_search"
description = "Search the web for up-to-date information"
entry_point = "chatddx.tools.web_search:web_search"

[tool.web_search.parameters]
type = "object"
properties.query = { type = "string" }
properties.max_results = { type = "integer", default = 5 }
required = ["query"]
additionalProperties = false

[recipe.plan]
description = "The management plan, as the medical-assistant agents ask for it."
tags = ["ddx"]
prompt = "case"
output = "management-plan"
sampling = "recommended"
translations = "sample"

[recipe.plan-shown]
description = "The same, with the schema shown to the model in the instructions."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan-shown"
sampling = "recommended"
translations = "sample"

[recipe.plan-prompted]
description = "The same, with the schema shown and nothing enforcing it."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan-prompted"
sampling = "recommended"
translations = "sample"

[recipe.plan-web]
description = "The management plan, with a web search to call."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan"
sampling = "recommended"
toolset = "web"
translations = "sample"

[recipe.diagnoses]
description = "The differential alone, as the medical-assistant agents ask for it."
tags = ["ddx"]
prompt = "case"
output = "diagnoses"
sampling = "recommended"
translations = "sample"

[recipe.diagnoses-tool]
description = "The same, answered through the final-result tool."
tags = ["ddx"]
fork_of = "diagnoses"
prompt = "case"
output = "diagnoses-tool"
sampling = "recommended"
translations = "sample"

[recipe.free-text]
description = "The differential as plain lines."
tags = ["ddx"]
prompt = "case"
output = "free-text"
sampling = "recommended"
translations = "sample"

[recipe.free-text-guided]
description = "The differential as plain lines, with instructions placing the guidance and a worked example."
tags = ["ddx"]
fork_of = "free-text"
instructions = "clinician"
few_shot = "worked-example"
prompt = "case"
output = "free-text"
sampling = "recommended"
passthrough = "min-tokens"
translations = "sample"

[recipe.judge]
description = "Whether an answer meets a clinician's note, greedy."
tags = ["judge"]
purpose = "judge"
instructions = "judge"
prompt = "judge"
output = "verdict"
sampling = "greedy"

[recipe.judge-graded]
description = "A grade of an answer against a clinician's note, sampled as the model's makers recommend."
tags = ["judge"]
purpose = "judge"
instructions = "judge"
prompt = "judge"
output = "grade"
sampling = "recommended"

[judge.verdict]
description = "Whether the answer meets the note, greedy, so one seed."
recipe = "judge"
seeds = [1]

[judge.graded]
description = "A grade from 0 to 2, sampled under three seeds and averaged."
recipe = "judge-graded"
seeds = [1, 2, 3]

[canary_set.basics]
description = "Two greedy probes and a seeded one, the same for every engine."
canaries = [
  { messages = [
    { role = "user", content = "Reply with the single word: ready." }
  ], body = { temperature = 0, max_tokens = 8 } },
  { messages = [
    { role = "user", content = "What is 17 times 23? Reply with the number only." }
  ], body = { temperature = 0, max_tokens = 8 } },
  { messages = [{ role = "user", content = "Name one cause of chest pain." }], body = { temperature = 0.7, max_tokens = 16 }, seed = 7 },
]

[expectation_schema.targets]
json_schema_path = "schemas/targets.json"

[scorer.plan]
description = "The management plan's differential, warning, disposition and critical diagnoses, against the case's targets."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "differential", output = "$.diagnoses[*].diagnosis", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "warning", output = "$.acute_warning", expectation = "/warning", metric = "mentions" },
  { label = "disposition", output = "$.management.disposition", expectation = "/disposition", metric = "mentions" },
  { label = "dont-miss", output = "$.diagnoses[?@.critical == true].diagnosis", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.diagnoses]
description = "The listed differential, against the case's diagnosis and the diagnosis it mustn't miss."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "differential", output = "$.diagnoses[*]", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "dont-miss", output = "$.diagnoses[*]", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.free-text]
description = "The free text, whole and line by line, against the case's diagnosis and the diagnosis it mustn't miss."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "text", expectation = "/diagnosis", metric = "first_mention" },
  { label = "differential", split = "lines@1", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "dont-miss", split = "lines@1", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.raw]
description = "Unguided free text, whole, against the case's diagnosis."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "text", expectation = "/diagnosis", metric = "first_mention" }
]

[scorer.notes]
description = "The answer against Olof's notes on the case: his comment and his short answer judged as met, and his comment graded."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "comment", expectation = "$.notes[?@.author == 'Olof'].comment", metric = "verdict", judge = "verdict", params = { at = "/meets" } },
  { label = "answer", expectation = "$.notes[?@.author == 'Olof'].answer", metric = "verdict", judge = "verdict", params = { at = "/meets" } },
  { label = "graded", expectation = "$.notes[?@.author == 'Olof'].comment", metric = "points", judge = "graded", params = { at = "/points", max = 2 } },
]
