# The old inventory's slices, configurations and scorers (chatddx 7893656, src/chatddx/data/inventory/slices.toml,
# configurations.toml and scorers.toml), hand-edited into remastered's shape, and what the old inventory had no
# example of: instructions, few-shot examples, a passthrough and translations, in `free-text-guided`. `chatddx
# init-data` loads them into the archive.
#
# Tables are kinds and keys are component fields, except:
# - a reference names a record of the referenced kind;
# - `json_schema_path` loads a JSON file, relative to this one, in place of `json_schema`;
# - `from_facts` makes the record per model that a planned engine serves and the facts know: its chunk is
#   written from each model's facts (`ModelFacts.sampling_chunk` or `reasoning_chunk`), named
#   "<record> (<model>)", and a record referencing it is made per model too. A model whose facts refuse the
#   chunk gets none, and is reported, and so is a served model the facts don't know or a known one no engine
#   serves;
# - `fork_of` names a record of the same kind that this one is a variation of. It's loaded as a fork of that
#   record's thread, and doesn't inherit its fields;
# - a tool or a scorer without a `version` pins the version its `entry_point` has in the running chatddx, which
#   must ship it;
# - `tags` and `description` are catalog entries, not fields, and so is a scorer view's `label`. A tool's
#   `description` is a field too, the one the model reads.
#
# Instructions, few-shot, prompts, outputs, toolsets and translations that hold text the model reads are written in
# texts-<language>.toml, here texts-en.toml and texts-sv.toml, whose name gives their language; those here hold
# none. A recipe that
# names a text is made per language that has it, named "<recipe> (<language>)", or "<recipe> (<language>, <model>)"
# when it's made per model too.

# instruction.ddx was a system message made of the guidance slots and a user message of {{case}}: this prompt, with
# the output's guidance becoming the system message. instruction.bare is the same prompt with an output that
# brings no guidance (output.raw).
[prompt.case]
segments = [{ slot = "vignette" }, { slot = "appendices" }]

[output.raw]
description = "Free text with no guidance: whatever the model makes of the case alone."
contract = { kind = "text" }

# Sampling. The server fills in what a chunk leaves out, from the model's generation_config.
[sampling.generation-config]

[sampling.recommended]
description = "What the model's makers recommend for its default reasoning."
from_facts = { effort = "default" }

# recommended-4k was recommended with max_tokens = 4096; max_tokens is dropped from sampling.

[sampling.greedy]
temperature = 0

[sampling.fixed]
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 0
frequency_penalty = 0

# Reasoning. reasoning.default is no chunk at all: a recipe without one leaves reasoning to the model.
[reasoning.off]
from_facts = { effort = "off" }

[reasoning.on]
from_facts = { effort = "on" }

[reasoning.minimal]
from_facts = { effort = "minimal" }

[reasoning.low]
from_facts = { effort = "low" }

[reasoning.medium]
from_facts = { effort = "medium" }

[reasoning.high]
from_facts = { effort = "high" }

[reasoning.xhigh]
from_facts = { effort = "xhigh" }

[reasoning.on-budget-2048]
description = "A budget worth comparing against plain on."
from_facts = { effort = "on", budget = 2048 }

# Passthrough: an engine's own request options, which no other chunk covers.
[passthrough.min-tokens]
description = "No answer shorter than 8 tokens: vLLM's min_tokens."
body = { min_tokens = 8 }

# Tools.
[tool.web_search]
name = "web_search"
description = "Search the web for up-to-date information"
entry_point = "chatddx.tools.web_search:web_search"

[tool.web_search.parameters]
type = "object"
properties.query = { type = "string" }
properties.max_results = { type = "integer", default = 5 }
required = ["query"]
additionalProperties = false

# Configurations: recipes, compiled into skeleton threads.
[recipe.plan]
description = "The management plan, as the medical-assistant agents ask for it."
tags = ["ddx"]
prompt = "case"
output = "management-plan"
sampling = "recommended"

[recipe.plan-shown]
description = "The same, with the schema shown to the model in the instructions."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan-shown"
sampling = "recommended"

[recipe.plan-prompted]
description = "The same, with the schema shown and nothing enforcing it."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan-prompted"
sampling = "recommended"

[recipe.plan-web]
description = "The management plan, with a web search to call."
tags = ["ddx"]
fork_of = "plan"
prompt = "case"
output = "management-plan"
sampling = "recommended"
toolset = "web"

[recipe.diagnoses]
description = "The differential alone, as the medical-assistant agents ask for it."
tags = ["ddx"]
prompt = "case"
output = "diagnoses"
sampling = "recommended"

[recipe.diagnoses-tool]
description = "The same, answered through the final-result tool."
tags = ["ddx"]
fork_of = "diagnoses"
prompt = "case"
output = "diagnoses-tool"
sampling = "recommended"

[recipe.free-text]
description = "The differential as plain lines."
tags = ["ddx"]
prompt = "case"
output = "free-text"
sampling = "recommended"

# Made in English, and in Swedish with the instructions and the example written in it and the output translated.
[recipe.free-text-guided]
description = "The differential as plain lines, with instructions placing the guidance and a worked example."
tags = ["ddx"]
fork_of = "free-text"
instructions = "clinician"
few_shot = "worked-example"
prompt = "case"
output = "free-text"
sampling = "recommended"
passthrough = "min-tokens"
translations = "sample"

# Judges' requests: an answer against a clinician's note, as the judges below ask them. A judge's recipe is made as
# any other; its prompt's purpose makes it a judge's, which may read the completion and the expectation.
[recipe.judge]
description = "Whether an answer meets a clinician's note, greedy."
tags = ["judge"]
purpose = "judge"
instructions = "judge"
prompt = "judge"
output = "verdict"
sampling = "greedy"

[recipe.judge-graded]
description = "A grade of an answer against a clinician's note, sampled as the model's makers recommend."
tags = ["judge"]
purpose = "judge"
instructions = "judge"
prompt = "judge"
output = "grade"
sampling = "recommended"

# Judges: a recipe, made for the model the engine serves when it's made per model, an engine of the World, and the
# seeds it's asked under. The engines are the sample World's, so another World skips them, and the scorers that name
# them, until it names judges of its own.
[judge.verdict]
description = "Whether the answer meets the note, greedy, so one seed."
recipe = "judge"
engine = "qwen3-8b-awq@fake"
seeds = [1]

[judge.graded]
description = "A grade from 0 to 2, sampled under three seeds and averaged."
recipe = "judge-graded"
engine = "gpt-oss-20b@fake"
seeds = [1, 2, 3]

# A canary set: fixed probes, the same for every engine and holding nothing of a case, that a run can send before and
# after its items to see whether its engine still answers as it did.
[canary_set.basics]
description = "Two greedy probes and a seeded one, the same for every engine."
canaries = [
  { messages = [{ role = "user", content = "Reply with the single word: ready." }], body = { temperature = 0, max_tokens = 8 } },
  { messages = [{ role = "user", content = "What is 17 times 23? Reply with the number only." }], body = { temperature = 0, max_tokens = 8 } },
  { messages = [{ role = "user", content = "Name one cause of chest pain." }], body = { temperature = 0.7, max_tokens = 16 }, seed = 7 },
]

# Reference data for scoring.
[expectation_schema.targets]
json_schema_path = "schemas/targets.json"

# Scorers. The old scorers each read one named view of whichever output had it: reciprocal_rank the differential,
# first_mention the whole text, and warning_mentions and disposition_mentions their parts of the plan, all against
# the case's targets. A scorer here is bound to an output's shape by its selectors, so there is one per shape, with
# the old scorers as its views and the old view names as their labels.
# A case's `dont_miss` is held to what each output can say: a plan marks the diagnoses it holds critical, so the plan
# scorer reads only those, while a list or free text can only name it. A `warning = false` is met by a plan whose
# acute_warning is null. A target's `text` is for people and judges; the pattern views leave a target without a
# pattern unscored.
[scorer.plan]
description = "The management plan's differential, warning, disposition and critical diagnoses, against the case's targets."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "differential", output = "$.diagnoses[*].diagnosis", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "warning", output = "$.acute_warning", expectation = "/warning", metric = "mentions" },
  { label = "disposition", output = "$.management.disposition", expectation = "/disposition", metric = "mentions" },
  { label = "dont-miss", output = "$.diagnoses[?@.critical == true].diagnosis", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.diagnoses]
description = "The listed differential, against the case's diagnosis and the diagnosis it mustn't miss."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "differential", output = "$.diagnoses[*]", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "dont-miss", output = "$.diagnoses[*]", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.free-text]
description = "The free text, whole and line by line, against the case's diagnosis and the diagnosis it mustn't miss."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "text", expectation = "/diagnosis", metric = "first_mention" },
  { label = "differential", split = "lines@1", expectation = "/diagnosis", metric = "reciprocal_rank" },
  { label = "dont-miss", split = "lines@1", expectation = "/dont_miss", metric = "mentions" },
]

[scorer.raw]
description = "Unguided free text, whole, against the case's diagnosis."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [{ label = "text", expectation = "/diagnosis", metric = "first_mention" }]

# Olof's notes, judged: his comment and his short answer each against the answer, and his comment graded. A case
# without his notes gives these views nothing to judge.
[scorer.notes]
description = "The answer against Olof's notes on the case: his comment and his short answer judged as met, and his comment graded."
entry_point = "chatddx.scorers.metrics:score"
expectation_schema = "targets"
views = [
  { label = "comment", expectation = "$.notes[?@.author == 'Olof'].comment", metric = "verdict", judge = "verdict", params = { at = "/meets" } },
  { label = "answer", expectation = "$.notes[?@.author == 'Olof'].answer", metric = "verdict", judge = "verdict", params = { at = "/meets" } },
  { label = "graded", expectation = "$.notes[?@.author == 'Olof'].comment", metric = "points", judge = "graded", params = { at = "/points", max = 2 } },
]
