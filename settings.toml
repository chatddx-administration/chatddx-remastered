# What chatddx.settings.STAMPED_FROM holds: the stage from which a thing has its docs/<kind>/<thing>.md stamped.
[stamped_from]
comments = "drafted"
surfaces = "solidified"
whoopses = "drafted"

[index]
# Policy: what the indexes leave out of a part's code: code copied in as its makers write it, whose comments aren't the
# project's.
left_out = ["frontend/src/lib/components/ui"]

[costs]
# Policy: the machine class, as MACHINE_CLASS names it, whose costs the docs quote
# (dev/src/chatddx_dev/costs/__init__.py:write).
quoted = "container"
quoted_in = ["AGENTS.md", "docs/parts/dev.md"]
