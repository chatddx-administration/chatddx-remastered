# Project-wide settings: the package ships this as chatddx/settings.toml, and src/chatddx/settings.py reads it, as it
# holds the app's own.

# What each check of dev/check.sh reads besides dev/check.sh: it skips a check that passed till one of these changes,
# and flake.nix runs the check on these alone, so that a path missing here fails there. A check that nix doesn't run
# reads all, as told by ".".
[checks.inputs]
openapi = [
  "settings.toml",
  "src",
  "worlds",
  "docs/comments",
  "docs/surfaces",
  "docs/whoopses",
  "frontend/openapi.json",
  "pyproject.toml",
  "uv.lock",
  "dev/dev-db.sh",
  ".env-devshell",
  "dev/pyproject.toml",
  "dev/src",
]
index = [
  "settings.toml",
  "src",
  "worlds",
  "docs",
  "AGENTS.md",
  "README.md",
  "frontend/openapi.json",
  "frontend",
  "nix",
  "dev",
  "pyproject.toml",
  "uv.lock",
  ".env-devshell",
]
stamps = [
  "settings.toml",
  "src",
  "docs",
  "AGENTS.md",
  "README.md",
  "pyproject.toml",
  "uv.lock",
  "dev/pyproject.toml",
  "dev/src",
  "dev/stamped.sh",
]
python-lint = [
  "settings.toml",
  "src",
  "worlds",
  "docs/comments",
  "docs/surfaces",
  "docs/whoopses",
  "frontend/openapi.json",
  "pyproject.toml",
  "uv.lock",
  "dev/dev-db.sh",
  ".env-devshell",
  "dev/pyproject.toml",
  "dev/src",
]
python-tests = [
  "settings.toml",
  "src",
  "worlds",
  "docs/comments",
  "docs/surfaces",
  "docs/whoopses",
  "frontend/openapi.json",
  "pyproject.toml",
  "uv.lock",
  "dev/dev-db.sh",
  ".env-devshell",
  "dev/pyproject.toml",
  "dev/src",
]
format = [
  "settings.toml",
  "src",
  "frontend",
  "docs",
  "AGENTS.md",
  "README.md",
  "dev",
  "pyproject.toml",
  ".claude/settings.json",
  ".prettierrc",
  ".prettierignore",
  ".editorconfig",
  ".taplo.toml",
]
docs = [
  "settings.toml",
  "docs",
  "AGENTS.md",
  "README.md",
  "src",
  "dev/pyproject.toml",
  "dev/src",
]
dev = [
  "dev/agent.sh",
  "dev/operator.sh",
  "dev/dev-db.sh",
  "dev/write.sh",
  "dev/stamped.sh",
  "dev/test",
  ".shellcheckrc",
  "settings.toml",
]
frontend = [
  "frontend",
  "src/chatddx/portal/templates",
  "worlds/test/_data/schemas",
  "worlds/sample/_data/schemas",
]
locale = ["."]
pending = ["."]
browser = ["."]

# What dev/agent.sh checks when.
[agent]
checked_at_session_start = [
  "openapi",
  "index",
  "stamps",
  "locale",
  "pending",
  "format",
  "python-lint",
  "frontend",
  "docs",
]
checked_at_hand_over = ["format", "python-lint", "frontend", "docs", "dev"]
# Policy: checked after the others, each alone, so that what they take counts towards the figures the docs quote
# (dev/src/chatddx_dev/costs/__init__.py:medians).
timed_at_hand_over = ["python-tests", "browser"]
refused_at_turn_start = ["openapi", "locale"]
told_at_turn_start = ["pending", "format", "python-lint", "frontend"]

# What dev/operator.sh checks when.
[operator]
refused_at_stamp = ["openapi", "locale", "pending"]
told_at_fetch = ["pending"]

# What chatddx.settings.PARTS holds: each part of the project at its stage, as AGENTS.md's "Development stages" names
# them; its class, the vocabulary it speaks: datamodel, the glossary's terms, ux, what people see and do, or machinery,
# what makes it run; its doc, if it has one; and the code that makes it, which no other part's code holds.
[parts.api]
stage = "solidified"
class = "machinery"
doc = "docs/parts/api.md"
code = ["src/chatddx/api", "frontend/src/lib/api"]

[parts.bench]
stage = "solidified"
class = "datamodel"
doc = "docs/parts/bench.md"
