# Policy: taplo formats what is named here and nothing else, so that a world's data is left as it is.
include = ["settings.toml", "pyproject.toml", "src/**/*.toml"]
# Accommodating for src/chatddx/settings.toml, a link to settings.toml.
exclude = ["src/chatddx/settings.toml"]

[formatting]
array_auto_collapse = false
