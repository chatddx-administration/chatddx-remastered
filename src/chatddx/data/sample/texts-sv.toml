# The sample's texts in Swedish, in factors.toml's format: the instructions and the example of `free-text-guided`,
# written in Swedish as cases are, and translations of every text of texts-en.toml's outputs and toolset, which
# compilation passes through them, the schemas' titles and descriptions and the tool's description included.
# Translated by an agent from texts-en.toml, and not yet reviewed by a clinician or a translator.

[instructions.clinician]
text = [
  "Du bistår en läkare på en akutmottagning. Läs fallet och ge din bedömning.",
  { insert = "output_guidance", before = "\n\n" },
]

[few_shot.worked-example]
messages = [
  { role = "user", content = "En 67-årig man har sedan en timme kraftig central bröstsmärta som strålar ut i vänster arm, med kallsvett och illamående. Blodtryck 150/90, puls 104." },
  { role = "assistant", content = "Akut koronart syndrom\nAortadissektion\nLungemboli\nPerikardit" },
]

[translations.sample]
description = "The sample's outputs and toolset in Swedish."

[translations.sample.entries]
"Fill in the management plan for the case." = "Fyll i handläggningsplanen för fallet."
"Fill in the management plan for the case.\n\nAnswer with a JSON object that matches this JSON Schema, and nothing else:\n\n" = "Fyll i handläggningsplanen för fallet.\n\nSvara med ett JSON-objekt som följer detta JSON Schema, och inget annat:\n\n"
"List the plausible diagnoses, most likely first." = "Lista de tänkbara diagnoserna, den mest sannolika först."
"List the plausible diagnoses, one per line, most likely first." = "Lista de tänkbara diagnoserna, en per rad, den mest sannolika först."
"Give your answer by calling this tool, with the answer as its arguments." = "Ge ditt svar genom att anropa det här verktyget, med svaret som argument."
"You have access to a web_search tool. Use it whenever you need current facts, documentation, or anything you're not confident about from memory, instead of guessing." = "Du har tillgång till verktyget web_search. Använd det när du behöver aktuella fakta, dokumentation eller något du inte är säker på utifrån minnet, i stället för att gissa."
"Search the web for up-to-date information" = "Sök på webben efter aktuell information"
