<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ChatDDX{% endblock %}</title>
</head>
<body>
  <header>
    <a href="/">ChatDDX</a>
    {% if person %}
    <span>{{ person.name }}</span>
    <form method="post" action="/sign-out"><button>Sign out</button></form>
    {% endif %}
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
