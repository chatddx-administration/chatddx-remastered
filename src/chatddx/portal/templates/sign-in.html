{% extends "base.html" %}
{% block title %}Sign in · ChatDDX{% endblock %}
{% block main %}
<h1>Sign in</h1>
{% if wrong %}
<p role="alert">Wrong login or password.</p>
{% endif %}
<form method="post" action="/sign-in">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Login <input name="login" value="{{ login }}" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button>Sign in</button>
</form>
{% endblock %}
