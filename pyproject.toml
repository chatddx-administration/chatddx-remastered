[project]
name = "chatddx"
version = "0.0.0+dev"
description = "A reproducible and composable rig for accuracy assessment of LLMs in emergency care"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "referencing>=0.37.0",
    "rich>=15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatddx = "chatddx.cli:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint = ["ruff>=0.16.9"]
test = [
  "httpx2>=2.13.1",
  "pytest>=9.1.1",
]
typing = [
  "basedpyright>=1.40.1",
  "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
reportAny = false
reportExplicitAny = false

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest]
testpaths = ["src"]
strict_markers = true
markers = [
  "solidified: tests of what docs/ describes",
  "wip: tests of what agents/wip-*.md plans",
  "slow: a call of 0.2 s or more, left out of the quick run: pytest -m 'not slow'",
]
